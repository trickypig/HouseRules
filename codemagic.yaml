workflows:
  ios-testflight:
    name: HouseRules iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Name of the App Store Connect API key as added in the Codemagic UI
      # (Teams/Personal Account -> Integrations -> App Store Connect).
      app_store_connect: House Rules
    environment:
      groups:
        # Codemagic variable group that must contain CERTIFICATE_PRIVATE_KEY
        # (the PEM private key used to create/fetch the distribution certificate).
        - ios_signing
      vars:
        DOTNET_PROJECT: "MAUI/HouseRules/HouseRules.csproj"
        TARGET_FRAMEWORK: "net10.0-ios"
        BUNDLE_ID: "com.trickypig.houserules"
      # Must match what the pinned workload set (global.json, currently
      # 10.0.204.1) demands: its iOS SDK requires Xcode 26.6. Codemagic made
      # 26.6 the default image on 2026-09-06; pin it explicitly so a future
      # default bump can't silently move us off a matching Xcode.
      xcode: 26.6
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install .NET SDK and MAUI workload
        script: |
          # The Codemagic macOS image does not put a .NET 10 SDK on PATH, so
          # install it explicitly with Microsoft's official script, then make it
          # available to this and all later build steps via $CM_ENV.
          #
          # The channel is pinned to the 10.0.2xx feature band (not bare "10.0")
          # because global.json pins a 10.0.2xx workload set, and a workload set
          # only installs on an SDK of the same band.
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          /tmp/dotnet-install.sh --channel 10.0.2xx --install-dir "$HOME/.dotnet"
          export PATH="$HOME/.dotnet:$PATH"
          echo "PATH=$HOME/.dotnet:$PATH" >> $CM_ENV
          dotnet --version
          # Run from the clone root so global.json is discovered: its
          # sdk.workloadVersion puts the CLI in workload-set update mode and
          # installs that exact set instead of the newest loose manifests.
          cd "$CM_BUILD_DIR"
          dotnet workload install maui
          echo "Workload set in use: $(dotnet workload --version)"
      - name: Set up code signing (create cert + profile if missing)
        script: |
          # Initialize the build keychain, then fetch signing files via the
          # App Store Connect integration above. --create registers/creates the
          # App Store provisioning profile for the bundle ID if it does not yet
          # exist, and downloads it (plus the distribution certificate that was
          # generated in the Codemagic UI) onto the build machine.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
      - name: Extract signing identity and profile name
        script: |
          # dotnet publish needs the certificate common name and the
          # provisioning profile NAME (not UUID). Extract both and persist
          # them to $CM_ENV so the next script can use them.
          CERT_NAME=$(keychain list-certificates \
            | jq -r '.[] | select(.common_name | test("Distribution|Apple Development")) | .common_name' \
            | head -1)
          PROFILE_PATH=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" -print -quit)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)
          echo "Using certificate: $CERT_NAME"
          echo "Using provisioning profile: $PROFILE_NAME"
          echo "CERT_NAME=$CERT_NAME" >> $CM_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $CM_ENV
      - name: Compute next build number from TestFlight
        script: |
          # Look up the app's numeric App Store id from its bundle id, then ask
          # TestFlight for the highest build number already uploaded and add 1.
          # Falls back to 0 (=> first build is 1) if the app has no builds yet.
          APP_ID=$(app-store-connect apps list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --json | jq -r '.[0].id')
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_ID" --platform IOS || echo "0")
          BUILD_NUMBER=$(( ${LATEST_BUILD_NUMBER:-0} + 1 ))
          echo "Next build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
      - name: Build and sign iOS app
        script: |
          dotnet publish "$DOTNET_PROJECT" \
            -f "$TARGET_FRAMEWORK" \
            -c Release \
            -p:ArchiveOnBuild=true \
            -p:BuildIpa=true \
            -p:ApplicationVersion=$BUILD_NUMBER \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="$CERT_NAME" \
            -p:CodesignProvision="$PROFILE_NAME"
    artifacts:
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
